name: Documentation problem
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:
  - documentation
  - needs-triage
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for the same documentation problem.
          required: true
        - label: I have removed secrets, personal data, customer content, and confidential information.
          required: true
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Provide the page, section, or URL where possible.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing, incorrect, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: false

